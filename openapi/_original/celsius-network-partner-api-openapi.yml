                example:
                  value: *id024
components:
  securitySchemes:
    partnerToken:
      type: apiKey
      in: header
      name: X-Cel-Partner-Token
      description: Partner key issued by Celsius and securely provided to the partner. Required on every
        authenticated request, for every partnership type.
    userToken:
      type: apiKey
      in: header
      name: X-Cel-User-Token
      description: User token created by the partner for each of its users. Used by Segmented Integration
        partners.
    apiKey:
      type: apiKey
      in: header
      name: X-Cel-Api-Key
      description: API key issued by Celsius and securely provided to the partner. Used by Omnibus and
        Omnibus Treasury partners.
  schemas:
    Error:
      type: object
      description: Celsius error envelope. `slug` is the stable machine-readable error code and `message`
        the human-readable text; older responses use `msg` instead of `message`.
      properties:
        message:
          type: string
          description: Human readable error message.
        msg:
          type: string
          description: Legacy human readable error message.
        slug:
          type: string
          description: Stable machine-readable error code.
          examples:
          - COMPLIANCE_ERROR
          - COIN_NOT_FOUND
          - INSUFFICIENT_FUNDS
    Message:
      type: object
      description: Simple message envelope.
      properties:
        message:
          type: string
        msg:
          type: string
    StatusFlag:
      type: object
      properties:
        status:
          type: boolean
    SuccessFlag:
      type: object
      properties:
        success:
          type: boolean
    KycStatus:
      type: object
      description: State of a KYC application.
      properties:
        status:
          type: string
          description: Status of the KYC application.
          enum:
          - COLLECTING
          - PENDING
          - PASSED
          - REJECTED
          - PERMANENTLY_REJECTED
        reasons:
          type: object
          description: Rejection reasons keyed by reason name; each value is always `consider`.
          additionalProperties:
            type: string
    CreateUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        userToken:
          type: string
    BalanceSummary:
      type: object
      properties:
        balance:
          type: object
          description: User's balance keyed by coin.
          additionalProperties:
            type: string
    CoinBalance:
      type: object
      properties:
        amount:
          type: string
          description: Balance in the requested coin.
        amount_in_usd:
          type: string
          description: Balance converted to USD.
    AccruedInterest:
      type: object
      description: Interest a user has accrued for a single coin.
      properties:
        amount:
          type: string
          description: Interest accrued In Kind (in the coin itself).
        amount_cel:
          type: string
          description: Interest accrued In CEL.
        amount_usd:
          type: number
          description: Interest accrued converted to USD (In Kind plus In CEL).
        coin:
          type: string
          description: Coin on which the interest was accrued.
    InterestSummary:
      type: object
      properties:
        interest:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AccruedInterest'
        total_amount_usd:
          type: string
          description: Total USD sum of all accrued interest.
    Pagination:
      type: object
      description: Splits a collection into pages of per_page items.
      properties:
        total:
          type: number
          description: Total number of items.
        pages:
          type: number
          description: Total number of pages.
        current:
          type: number
          description: Current page number.
        per_page:
          type: number
          description: Number of items per page.
        showing:
          type: string
          description: Where in the collection the first and last item sit.
    Transaction:
      type: object
      description: A single transaction of a user in the Celsius system.
      properties:
        id:
          type: string
          format: uuid
          description: Transaction id in the Celsius system.
        amount:
          type: string
          description: Transaction amount, rounded down to the last significant decimal place.
        amount_precise:
          type: string
          description: Precise transaction amount, without rounding.
        amount_usd:
          type: string
          description: Transaction amount converted to USD at the `time` property.
        coin:
          type: string
          description: Transaction coin.
        state:
          type: string
          description: Transaction state.
          enum:
          - processing
          - unconfirmed
          - confirmed
          - rejected
        nature:
          type: string
          description: Transaction nature.
          enum:
          - deposit
          - withdrawal
          - interest
        time:
          type: string
          format: date-time
          description: Transaction date and time.
        tx_id:
          type:
          - string
          - 'null'
          description: Transaction blockchain hash.
        original_interest_coin:
          type: string
          description: Original coin for which this transaction was created. Present only when `nature`
            is interest.
        interest_amount_in_original_coin:
          type: string
          description: Amount in original_interest_coin before conversion to `coin`.
    TransactionPage:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        record:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    TransactionStatus:
      type: object
      properties:
        tx_id:
          type:
          - string
          - 'null'
          description: Transaction hash on the blockchain.
        state:
          type: string
          enum:
          - processing
          - unconfirmed
          - confirmed
          - rejected
    DepositAddress:
      type: object
      properties:
        address:
          type: string
          description: Deposit address. For BTC this is the segwit address.
        addressSecondary:
          type: string
          description: Legacy deposit address. Present only for BTC.
    WithdrawalAddresses:
      type: object
      description: Pre-approved withdrawal addresses keyed by coin.
      additionalProperties:
        type: string
    WithdrawalAccepted:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Transaction id in the Celsius system.
    InterestRate:
      type: object
      description: Interest rate for a single coin.
      properties:
        coin:
          type: string
          description: Interest rate coin.
        rate:
          type: string
          description: Interest rate.
        currency:
          type: object
          description: Currency metadata for the coin.
          properties:
            id:
              type: integer
            name:
              type: string
            short:
              type: string
            image_url:
              type: string
    InterestRates:
      type: object
      properties:
        interestRates:
          type: array
          items:
            $ref: '#/components/schemas/InterestRate'
    Country:
      type: object
      properties:
        alpha2:
          type: string
        alpha3:
          type: string
        countryCallingCodes:
          type: array
          items:
            type: string
        currencies:
          type: array
          items:
            type: string
        emoji:
          type: string
        ioc:
          type: string
        languages:
          type: array
          items:
            type: string
        name:
          type: string
        status:
          type: string
    Countries:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
    Currencies:
      type: object
      properties:
        currencies:
          type: array
          items:
            type: string
    AmountRollup:
      type: object
      description: Total USD amount plus a per-coin amount / amount_usd breakdown.
      properties:
        total_amount_usd:
          type: string
      additionalProperties: true
    Statistics:
      type: object
      properties:
        deposit_count:
          type:
          - number
          - string
        deposit_amount:
          $ref: '#/components/schemas/AmountRollup'
        withdrawal_count:
          type:
          - number
          - string
        withdrawal_amount:
          $ref: '#/components/schemas/AmountRollup'
        interest_count:
          type:
          - number
          - string
        interest_amount:
          $ref: '#/components/schemas/AmountRollup'
    Health:
      type: object
      properties:
        status:
          type: string
    HealthEcho:
      type: object
      properties:
        msg:
          type:
          - string
          - 'null'
          description: The echoed message.
