- {date: '2024-01-31', event: Celsius emerged from Chapter 11 and began distributing over $3 billion of cryptocurrency to creditors.}
- {date: '2024-02-29', event: Celsius mobile and web applications shut down as part of the wind-down. The Partner API surface went with them.}
