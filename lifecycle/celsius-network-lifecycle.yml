generated: '2026-08-02'
method: searched
source: https://celsius.network/
status: retired
summary: >-
  The Celsius Partner (Wallet) API is retired. Celsius Network froze withdrawals in June 2022,
  filed for Chapter 11 in the Southern District of New York on 2022-07-13, had its plan of
  reorganization confirmed on 2023-11-09, emerged from Chapter 11 on 2024-01-31, and shut down
  its mobile and web applications on 2024-02-29 as part of the wind-down of its business
  operations. The production API host wallet-api.celsius.network and the developer portal
  developers.celsius.network no longer resolve in DNS. celsius.network now serves a single
  wind-down notice directing creditors to the Stretto claims administration site.
versioning:
  scheme: unversioned-path
  current: null
  note: >-
    The Partner API exposed unversioned paths (/wallet, /kyc, /util, /users) directly on the
    wallet-api host. No version segment, version header or version parameter was documented.
    The official SDK versioned itself semantically (celsius-sdk 0.9.4 through 1.0.0) and its
    CHANGELOG is the only published record of contract change.
deprecation:
  policy_url: https://celsius.network/
  policy_type: wind-down-notice
  sunset_header: false
  announced: '2024-01-31'
  effective: '2024-02-29'
  note: >-
    Celsius published no RFC 8594 Sunset/Deprecation header support and no ordinary
    deprecation policy. The retirement was announced as part of the Chapter 11 plan of
    reorganization; the wind-down notice on celsius.network is the authoritative published
    end-of-life statement for the platform and therefore for the API.
  evidence:
  - https://celsius.network/
  - https://cases.stretto.com/celsius/
sla:
  url: null
  uptime_target: null
status_page:
  url: null
  note: >-
    Celsius never published a hosted status page. The API exposed its own liveness surface
    instead - GET /health and GET /health/echo/{message} - both of which are now unreachable.
  health_operations:
  - openapi/celsius-network-partner-api-openapi.yml#getHealth
  - openapi/celsius-network-partner-api-openapi.yml#health
