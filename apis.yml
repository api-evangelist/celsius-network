aid: celsius-network
name: Celsius Network
description: >-
  Celsius Network LLC was a global cryptocurrency lending, custody and yield platform, founded
  in 2017, that let retail and institutional customers earn interest on crypto deposits, borrow
  US dollars and stablecoins against their holdings, and — through the Celsius Partner API —
  let third-party partners embed that earning power directly into their own applications. The
  Partner (Wallet) API exposed per-coin balances, accrued interest, transaction history,
  deposit addresses, withdrawals, KYC verification and utility reference data across three
  partnership models: Omnibus Integration, Omnibus Treasury, and Segmented Integration, where
  the partner created and managed a Celsius wallet for each of its own end users. Celsius froze
  withdrawals on 2022-06-12, filed for Chapter 11 bankruptcy on 2022-07-13, had its plan of
  reorganization confirmed on 2023-11-09, emerged on 2024-01-31 and shut down its mobile and
  web applications on 2024-02-29 as part of the wind-down of its business operations. The
  Partner API and the developer portal are retired and their hosts no longer resolve. The
  reorganized bitcoin-mining business was spun out as Ionic Digital, a separate company that
  listed on Nasdaq under IOND on 2026-07-28. This profile preserves the API contract as a
  historical record, derived entirely from first-party artifacts that are still publicly
  resolvable.
